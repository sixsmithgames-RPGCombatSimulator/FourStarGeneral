<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" role="img" aria-labelledby="title description">
  <title id="title">Operation Overlord theater illustration</title>
  <desc id="description">An authored schematic of the Channel crossing and the five Normandy beachheads. Southern England lies above Normandy. Dashed gold routes connect the Allied ports to the beachheads; inland roads lead toward Carentan, Bayeux, and Caen. This illustration is not a live campaign map.</desc>
  <!-- Original vector illustration. Geography is schematic, not a navigational map. -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#adc0b4" stroke-opacity=".12" />
    </pattern>
    <pattern id="land-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v9" stroke="#899781" stroke-opacity=".13" stroke-width="2" />
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="m0 0 7 4-7 4 2-4Z" fill="#ead090" />
    </marker>
  </defs>
  <rect width="820" height="650" fill="#172a29" />
  <path d="M0 0h820v112l-81-3-50 16-61-19-22 26-62-10-30 14-32-26-30 25-46-13-30 31-60-17-29 19-46-10-32 23-21-25-60 29-34-12-25 22-49-18-24 23Z" fill="#344337" stroke="#87967d" stroke-width="2" />
  <path d="M0 650V472l52 5 36 14 54 1 44-22 35-54 1-64-18-63 29-13 32 14 30-8 21 21-3 48 13 44 35 26 58 15 63-17 46 19 75 11 77 19 69 44 53 8v135Z" fill="#344337" stroke="#87967d" stroke-width="2" />
  <path d="M0 650V472l52 5 36 14 54 1 44-22 35-54 1-64-18-63 29-13 32 14 30-8 21 21-3 48 13 44 35 26 58 15 63-17 46 19 75 11 77 19 69 44 53 8v135Z" fill="url(#land-hatch)" />
  <rect width="820" height="650" fill="url(#grid)" />
  <g fill="none" stroke="#829079" stroke-width="1.5" opacity=".65">
    <path d="m212 294 36 62-1 67 21 46 20 56 108-12 98 37 98-6 102 42" />
    <path d="m256 308 19 65 4 61 9 91-20 99m20-99 81 65m27-77 55-50 43 87 109-60m-12 54 28 95" />
    <path d="m10 543 85 3 94-33 99 12" />
  </g>
  <g fill="none" stroke="#ead090" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)">
    <path d="M121 162C149 195 225 218 272 375" />
    <path d="M334 139C344 214 334 282 346 396" />
    <path d="M446 123C469 239 464 311 454 408" />
    <path d="M459 127C508 238 526 341 529 421" />
    <path d="M566 116C611 229 620 341 606 441" />
  </g>
  <g fill="#f0ebdf" font-family="Arial, sans-serif">
    <text x="34" y="43" font-size="13" letter-spacing="3" fill="#ead090">ALLIED OPERATIONS / NORMANDY</text>
    <text x="290" y="70" font-size="25" letter-spacing="5">SOUTHERN ENGLAND</text>
    <text x="75" y="143" font-size="15">Plymouth</text>
    <text x="284" y="119" font-size="15">Portland</text>
    <text x="397" y="104" font-size="15">Southampton</text>
    <text x="558" y="94" font-size="15">Portsmouth</text>
    <text x="382" y="275" font-family="Georgia, serif" font-size="29" font-style="italic" fill="#b1c3b7" letter-spacing="2">English Channel</text>
    <text x="125" y="332" font-size="13" fill="#bac4b9">COTENTIN</text>
    <text x="290" y="610" font-size="29" letter-spacing="7">NORMANDY</text>
  </g>
  <g fill="#172a29" stroke="#ead090" stroke-width="2">
    <circle cx="121" cy="162" r="5" /><circle cx="334" cy="139" r="5" />
    <circle cx="446" cy="123" r="5" /><circle cx="566" cy="116" r="5" />
  </g>
  <g fill="#ead090" stroke="#172a29" stroke-width="3">
    <rect x="258" y="379" width="32" height="22" rx="1" transform="rotate(65 274 390)" />
    <rect x="332" y="401" width="36" height="20" rx="1" transform="rotate(18 350 411)" />
    <rect x="440" y="411" width="32" height="20" rx="1" transform="rotate(-10 456 421)" />
    <rect x="516" y="426" width="32" height="20" rx="1" transform="rotate(10 532 436)" />
    <rect x="590" y="446" width="32" height="20" rx="1" transform="rotate(10 606 456)" />
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#f0ebdf">
    <text x="304" y="371">UTAH</text>
    <text x="311" y="451">OMAHA</text>
    <text x="429" y="392">GOLD</text>
    <text x="508" y="406">JUNO</text>
    <text x="583" y="426">SWORD</text>
  </g>
  <g fill="#f0ebdf" font-family="Arial, sans-serif" font-size="16">
