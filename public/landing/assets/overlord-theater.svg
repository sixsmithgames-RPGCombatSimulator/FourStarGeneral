    <circle cx="451" cy="463" r="3" /><text x="458" y="486">Bayeux</text>
    <circle cx="603" cy="490" r="3" /><text x="619" y="516">Caen</text>
  </g>
  <g transform="translate(752 209)" stroke="#bac4b9" fill="none">
    <path d="M0 42V-13m-8 12 8-12 8 12M-17 18h34" />
    <circle cy="18" r="12" />
    <text x="0" y="-25" text-anchor="middle" stroke="none" fill="#bac4b9" font-family="Arial, sans-serif" font-size="13">N</text>
  </g>
  <g fill="#bac4b9" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.3">
    <text x="28" y="623">D+1 / 7 JUNE 1944</text>
    <text x="618" y="623">THEATER SCHEMATIC</text>
  </g>
  <rect x="12" y="12" width="796" height="626" fill="none" stroke="#bac4b9" stroke-opacity=".25" />
</svg>
